  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .wordmark {
    font-size: 32px;
    color: #f2ede1;
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .wordmark:link, .wordmark:visited { color: #f2ede1 !important; }
  .wordmark em {
    color: #d4af37;
    font-style: italic;
  }
  .wordmark:link em, .wordmark:visited em { color: #d4af37 !important; }

  /* ---------------------------------------------------------------
     Respect the OS-level "reduce motion" setting.

     Only the auth page honoured this before. Animation is a nice touch,
     but for users with vestibular sensitivity it can cause genuine
     nausea and dizziness — and the setting exists precisely so they can
     say so once, system-wide, instead of per site. Transitions are cut
     to near-zero rather than removed outright so focus and hover states
     still read as responsive.
     --------------------------------------------------------------- */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
