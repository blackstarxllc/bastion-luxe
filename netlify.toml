# Bastion — Netlify configuration
#
# Security headers were previously not configured at all. For a site that
# handles real money and real personal data, these close off a set of
# common browser-level attacks (clickjacking, MIME sniffing, referrer
# leakage) that are cheap to prevent and expensive to be caught by.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Stops the site being embedded in an iframe on someone else's domain,
    # which is how clickjacking attacks trick users into clicking things
    # like "release funds" without realising it.
    X-Frame-Options = "DENY"

    # Stops browsers from second-guessing declared content types, which can
    # turn an uploaded file into an executable script.
    X-Content-Type-Options = "nosniff"

    # Don't leak the full URL (which can contain transaction IDs) to
    # third-party sites when a user clicks an external link.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for a year, including subdomains.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Camera and microphone are now allowed for this origin only, because
    # packing and unboxing evidence is recorded on the device — on mobile,
    # a file input with capture invokes the camera and a blanket camera=()
    # would silently break the single most important dispute control we
    # have. Geolocation and payment stay fully disabled.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"

# Never let a browser or CDN cache a serverless function response — these
# are transaction-state endpoints where a stale answer is a real problem.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


# ---------------------------------------------------------------------
# Scheduled deadline reminders.
#
# Hourly is the right cadence: deadlines are measured in days and the
# reminders fire at 24-hours-out checkpoints, so hourly is precise enough
# without being noisy.
#
# Safe to run this often because send_deadline_reminders() is idempotent —
# reminder_log has a unique index on (transaction_id, user_id, kind), so
# each person receives each reminder exactly once. Verified by running the
# sweep twice: first run sent, second sent zero.
# ---------------------------------------------------------------------
[functions."deadline-sweep"]
  schedule = "@hourly"


# ---------------------------------------------------------------------
# Keep private project files off the public website.
#
# publish = "." means every file in the repo is served at bastionmarket.com,
# including the setup notes (which contain internal emails and a webhook
# secret), the database migration files, and the server function source
# code. None of those are pages. These rules answer those addresses with the
# normal "page not found" page instead. They do NOT affect
# /.netlify/functions/* (with the dot), which is how the site actually
# calls its server functions.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/DO-THIS-NOW.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
