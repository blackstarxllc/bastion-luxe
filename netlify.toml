# Bastion — Netlify configuration
#
# Security headers were previously not configured at all. For a site that
# handles real money and real personal data, these close off a set of
# common browser-level attacks (clickjacking, MIME sniffing, referrer
# leakage) that are cheap to prevent and expensive to be caught by.

[build]
  publish = "."
  # The test suite runs before every deploy. If any test fails, Netlify
  # stops and the live site stays exactly as it was. See tests/run.js.
  command = "node tests/run.js"

[[headers]]
  for = "/*"
  [headers.values]
    # Stops the site being embedded in an iframe on someone else's domain,
    # which is how clickjacking attacks trick users into clicking things
    # like "release funds" without realising it.
    X-Frame-Options = "DENY"

    # Stops browsers from second-guessing declared content types, which can
    # turn an uploaded file into an executable script.
    X-Content-Type-Options = "nosniff"

    # Don't leak the full URL (which can contain transaction IDs) to
    # third-party sites when a user clicks an external link.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for a year, including subdomains.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Camera and microphone are now allowed for this origin only, because
    # packing and unboxing evidence is recorded on the device — on mobile,
    # a file input with capture invokes the camera and a blanket camera=()
    # would silently break the single most important dispute control we
    # have. Geolocation and payment stay fully disabled.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=()"

    # ---------------------------------------------------------------
    # Content-Security-Policy
    #
    # There was no CSP at all. This is the single cheapest control left
    # for a site that handles addresses, transaction IDs and escrow links.
    #
    # An honest note on 'unsafe-inline' for script-src: every page here
    # carries a large inline <script>, so a nonce/hash policy is not
    # possible without a build step that can rewrite them. Keeping
    # 'unsafe-inline' means this CSP does NOT stop injected inline script.
    # It is still worth having, because the directives that do the most
    # damage-limiting on a money site are the other ones:
    #
    #   connect-src  - an injected script cannot phone stolen session
    #                  tokens or transaction data out to an attacker's
    #                  server; only Supabase and this origin are reachable.
    #   form-action  - a planted <form> cannot post credentials elsewhere.
    #   base-uri     - blocks <base> hijacking, which silently repoints
    #                  every relative URL on the page.
    #   object-src   - no Flash/embed/applet vectors at all.
    #   frame-ancestors - clickjacking, matching X-Frame-Options.
    #
    # Removing 'unsafe-inline' is a real upgrade and is the right thing to
    # do once page scripts move into external files.
    #
    # connect-src also allowlists vpic.nhtsa.dot.gov: bastion-deal-detail.html
    # calls it client-side to verify a listed VIN against NHTSA's public
    # database. Without it here, the browser would silently block that fetch
    # the moment this CSP shipped, and the VIN check would just fail closed
    # forever with no visible error (it already degrades gracefully on
    # network failure, which is exactly what a CSP block looks like to it).
    # ---------------------------------------------------------------
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://xokyqobttfhugdponfpg.supabase.co; media-src 'self' blob: https://xokyqobttfhugdponfpg.supabase.co; connect-src 'self' https://xokyqobttfhugdponfpg.supabase.co https://cdn.jsdelivr.net https://vpic.nhtsa.dot.gov; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Never let a browser or CDN cache a serverless function response — these
# are transaction-state endpoints where a stale answer is a real problem.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"


# ---------------------------------------------------------------------
# Scheduled deadline reminders.
#
# Hourly is the right cadence: deadlines are measured in days and the
# reminders fire at 24-hours-out checkpoints, so hourly is precise enough
# without being noisy.
#
# Safe to run this often because send_deadline_reminders() is idempotent —
# reminder_log has a unique index on (transaction_id, user_id, kind), so
# each person receives each reminder exactly once. Verified by running the
# sweep twice: first run sent, second sent zero.
# ---------------------------------------------------------------------
[functions."deadline-sweep"]
  schedule = "@hourly"


# ---------------------------------------------------------------------
# Keep private project files off the public website.
#
# publish = "." means every file in the repo is served at bastionmarket.com,
# including the setup notes (which contain internal emails and a webhook
# secret), the database migration files, and the server function source
# code. None of those are pages. These rules answer those addresses with the
# normal "page not found" page instead. They do NOT affect
# /.netlify/functions/* (with the dot), which is how the site actually
# calls its server functions.
# ---------------------------------------------------------------------
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Operational notes are no longer shipped in the deploy artifact at all
# (they live in /docs, which is not published). This stays as a catch-all so
# that adding a stray .md to the repo root can never expose it: an allowlist
# would be better still, and is the next step once a build directory exists.
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

# The logo construction sheet is a design reference, not a page.
