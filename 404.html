<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion — Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0A0B0D; --ivory:#F1ECE1; --stone:#8D8F94; --brass:#C7A268; --brass-dim:#8C6F44; --brass-ink:#171308; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ min-height:100%; background:var(--ink); color:var(--ivory);
    font-family:'Inter', -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
  .wrap{ max-width:440px; }
  .mark{ width:96px; height:96px; margin:0 auto 32px; display:block; border-radius:50%; }
  .wordmark{ font-family:'Fraunces', Georgia, serif; font-size:30px; color:var(--ivory); text-decoration:none; }
  .wordmark em{ color:var(--brass); font-style:italic; }
  .code{ margin-top:28px; font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--brass); }
  h1{ margin-top:12px; font-family:'Fraunces', Georgia, serif; font-weight:400; font-size:34px; line-height:1.2; }
  p{ margin-top:14px; color:var(--stone); font-size:15px; line-height:1.6; }
  .btn{ display:inline-block; margin-top:32px; padding:14px 28px; border:1px solid var(--brass);
    color:var(--brass-ink); background:var(--brass); text-decoration:none; font-size:12.5px;
    letter-spacing:.14em; text-transform:uppercase; font-weight:500; border-radius:2px; transition:background .2s, color .2s; }
  .btn:hover{ background:transparent; color:var(--brass); }
  .alt{ display:block; margin-top:18px; color:var(--stone); font-size:13px; text-decoration:none; }
  .alt:hover{ color:var(--ivory); }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.01ms !important; } }
</style>
</head>
<body>
  <main class="wrap">
    <img class="mark" src="/icon-192.png" alt="">
    <a class="wordmark" href="/bastion-marketplace.html">Bast<em>ion</em></a>
    <div class="code">404</div>
    <h1>This page isn’t here.</h1>
    <p>The link may be old, or the listing may have sold or been removed.</p>
    <a class="btn" href="/bastion-marketplace.html">Back to the marketplace</a>
    <a class="alt" href="/bastion-support.html">Need help? Contact support</a>
  </main>
</body>
</html>
