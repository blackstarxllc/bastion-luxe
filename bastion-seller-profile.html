<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0d12">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bastion">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bastion — Seller Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0B0D;
    --ink-soft:#101216;
    --surface:#15171B;
    --field:#1B1E23;
    --field-border:#2A2D33;
    --ivory:#F1ECE1;
    --stone:#8D8F94;
    --stone-dim:#5B5D62;
    --brass:#C7A268;
    --brass-dim:#8C6F44;
    --brass-ink:#171308;
    --emerald:#2C5C4F;
    --rust:#B5453D;
    --hairline:rgba(241,236,225,0.08);
    --radius:2px;
    --radius-pill:999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    min-height:100%;
    background:
      radial-gradient(1100px 550px at 10% -10%, rgba(199,162,104,0.05), transparent 60%),
      var(--ink);
    color:var(--ivory);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--hairline);
    position:sticky; top:0;
    background:rgba(10,11,13,0.82);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    z-index:10;
  }
  @media(min-width:900px){ .nav{ padding:18px 56px; } }
  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:450;
    font-size:22px;
    color:var(--ivory);
    text-decoration:none;
  }
  .wordmark:link{ color:var(--ivory) !important; }
  .wordmark:visited{ color:var(--ivory) !important; }
  .wordmark em{ font-style:italic; font-weight:400; color:var(--brass); }
  .wordmark:link em{ color:var(--brass) !important; }
  .wordmark:visited em{ color:var(--brass) !important; }
  .footer-wordmark:link, .footer-wordmark:visited{ color:var(--stone-dim) !important; }
  .footer-wordmark:link em, .footer-wordmark:visited em{ color:var(--brass-dim) !important; }
  .back-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--stone);
    text-decoration:none;
    padding:10px 16px;
    border-radius:var(--radius-pill);
    transition:color 0.2s ease, background 0.2s ease;
  }
  .back-link:hover{ color:var(--ivory); background:rgba(255,255,255,0.04); }

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:56px 24px 120px;
  }
  @media(min-width:900px){ .wrap{ padding:72px 56px 140px; } }

  .profile-header{
    display:flex;
    align-items:center;
    gap:22px;
    padding-bottom:36px;
    border-bottom:1px solid var(--hairline);
  }
  .avatar-seal{
    width:72px; height:72px;
    border-radius:50%;
    border:1px solid var(--brass-dim);
    background:rgba(199,162,104,0.06);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif;
    font-size:30px;
    color:var(--brass);
    flex-shrink:0;
  }
  .profile-name{
    font-family:'Fraunces', serif;
    font-weight:450;
    font-style:italic;
    font-size:28px;
    color:var(--ivory);
  }
  .profile-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--stone);
    margin-top:8px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }

  .trusted-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--brass);
    background:rgba(199,162,104,0.12);
    padding:5px 11px;
    border-radius:var(--radius-pill);
  }
  .trusted-badge svg{ width:11px; height:11px; }

  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:36px;
  }
  .stat{
    background:var(--surface); border:1px solid var(--hairline); border-radius:14px;
    padding:22px; text-align:center;
  }
  .stat-value{
    font-family:'Fraunces', serif;
    font-weight:450;
    font-size:30px;
    color:var(--brass);
  }
  .stat-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--stone-dim);
    margin-top:8px;
  }

  .report-toggle{
    display:block;
    margin-top:20px;
    background:none; border:none;
    color:var(--stone-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .report-toggle:hover{ color:#E0958D; }
  .report-form{ margin-top:16px; max-width:420px; }
  .report-select, .report-textarea{
    width:100%;
    background:var(--field);
    border:1px solid var(--field-border);
    border-radius:10px;
    color:var(--ivory);
    font-family:'Inter', sans-serif;
    font-size:13px;
    padding:10px 14px;
    outline:none;
    margin-bottom:10px;
  }
  .report-select:focus, .report-textarea:focus{ border-color:var(--brass); }
  .report-textarea{ min-height:64px; resize:vertical; }
  .report-submit{
    background:var(--brass); color:var(--brass-ink); border:none;
    border-radius:var(--radius-pill); padding:10px 18px;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
  }
  .report-submit:disabled{ opacity:0.5; cursor:not-allowed; }
  .report-cancel{
    margin-left:10px;
    background:none; border:none; color:var(--stone-dim);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.06em; text-transform:uppercase; cursor:pointer;
  }
  .report-cancel:hover{ color:var(--ivory); }
  .report-done{ font-size:12px; color:#8FBBAC; margin-top:8px; }

  .section{ margin-top:56px; }
  .section-title{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:450;
    font-size:21px;
    color:var(--ivory);
    margin-bottom:22px;
  }

  .listings-grid{
    display:grid;
    grid-template-columns:repeat(1,1fr);
    gap:14px;
  }
  @media(min-width:640px){ .listings-grid{ grid-template-columns:repeat(2,1fr); } }

  .mini-card{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    display:flex;
    gap:14px;
    align-items:center;
    transition:border-color 0.2s ease, transform 0.2s ease;
  }
  .mini-card:hover{ border-color:rgba(199,162,104,0.3); transform:translateY(-2px); }
  .mini-photo{
    width:60px; height:60px;
    flex-shrink:0;
    border-radius:8px;
    background:linear-gradient(150deg, #17191d, #0d0e10);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .mini-photo img{ width:100%; height:100%; object-fit:cover; }
  .mini-photo .seal-tiny{ font-family:'Fraunces', serif; color:var(--brass-dim); font-size:16px; }
  .mini-name{ font-family:'Fraunces', serif; font-size:14px; color:var(--ivory); line-height:1.3; }
  .mini-price{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--brass); margin-top:4px; }

  .review-item{
    padding:18px 0;
    border-bottom:1px solid var(--hairline);
  }
  .review-item:last-child{ border-bottom:none; }
  .review-stars{ color:var(--brass); font-size:14px; letter-spacing:2px; }
  .review-comment{
    font-size:13px;
    color:var(--stone);
    line-height:1.6;
    margin-top:8px;
  }
  .review-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--stone-dim);
    margin-top:8px;
  }

  .empty-note{
    color:var(--stone);
    font-size:13px;
    padding:20px 0;
  }

  .state-block{
    text-align:center;
    padding:100px 24px;
    color:var(--stone);
  }
  .state-block h3{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:450;
    font-size:20px;
    color:var(--ivory);
    margin-bottom:10px;
  }
  .spinner{
    width:22px; height:22px;
    border:2px solid var(--field-border);
    border-top-color:var(--brass);
    border-radius:50%;
    margin:0 auto 18px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .hidden{ display:none !important; }

  /* ---------- NOTIFICATIONS ---------- */
  .notif-wrap{ position:relative; display:inline-flex; }
  .notif-bell{
    position:relative;
    background:none; border:1px solid var(--field-border, var(--hairline));
    color:var(--ivory);
    border-radius:var(--radius);
    width:36px; height:36px;
    display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color 0.2s ease;
  }
  .notif-bell:hover{ border-color:var(--brass); }
  .notif-bell svg{ width:17px; height:17px; }
  .notif-count{
    position:absolute; top:-5px; right:-5px;
    background:var(--brass); color:var(--brass-ink);
    font-family:'IBM Plex Mono', monospace; font-size:9.5px; font-weight:600;
    min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }
  .notif-dropdown{
    position:absolute; top:calc(100% + 10px); right:0;
    width:320px; max-height:240px; overflow-y:auto;
    background:var(--ink-soft); border:1px solid var(--hairline);
    border-radius:14px;
    box-shadow:0 12px 32px rgba(0,0,0,0.45);
    z-index:100;
  }
  .notif-dropdown-title{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--stone-dim);
    padding:14px 16px; border-bottom:1px solid var(--hairline);
  }
  .notif-item{
    padding:9px 14px; border-bottom:1px solid var(--hairline);
    cursor:pointer; transition:background 0.2s ease;
  }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:rgba(255,255,255,0.03); }
  .notif-item.unread{ background:rgba(199,162,104,0.06); }
  .notif-item-title{ font-family:'Fraunces', serif; font-size:13px; color:var(--ivory); }
  .notif-item-body{ font-size:11px; color:var(--stone); margin-top:2px; line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .notif-item-time{ font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--stone-dim); margin-top:3px; }
  .notif-empty{ padding:24px 16px; text-align:center; color:var(--stone-dim); font-size:12.5px; }
</style>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js").catch(function(){});
      });
    }
  </script>
</head>
<body>

<nav class="nav">
  <a href="bastion-marketplace.html" class="wordmark">Bast<em>ion</em></a>
  <div style="display:flex; align-items:center; gap:22px;">
    <div class="notif-wrap">
      <button class="notif-bell" id="notifBellBtn" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="notif-count" id="notifCount" style="display:none;"></span>
      </button>
      <div class="notif-dropdown" id="notifDropdown" style="display:none;">
        <div class="notif-dropdown-title">Notifications</div>
        <div id="notifList"></div>
      </div>
    </div>
    <a href="bastion-messages.html" class="back-link" style="position:relative;">Messages<span id="navMsgDot" style="display:none; position:absolute; top:-3px; right:-11px; width:7px; height:7px; border-radius:50%; background:var(--brass);"></span></a>

</nav>

<div id="loadingState" class="state-block">

  <h3>Loading seller profile…</h3>
</div>

<div class="wrap hidden" id="profileContent">

  <div class="profile-header">

    <div>
      <div class="profile-name" id="sellerName"></div>
      <div class="profile-meta" id="sellerMeta"></div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-value" id="statListings">0</div>
      <div class="stat-label">Active Listings</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statTrades">0</div>
      <div class="stat-label">Completed Trades</div>

  <button class="report-toggle" id="reportToggleBtn">Report this seller</button>
  <div class="report-form hidden" id="reportForm">
    <select id="reportReason" class="report-select">
      <option value="" disabled selected>Select a reason</option>

    </select>

</div>

  <a href="bastion-marketplace.html" class="footer-wordmark" style="font-family:'Fraunces', serif; font-size:16px; color:var(--stone-dim); text-decoration:none;">Bast<em style="color:var(--brass-dim);">ion</em></a>
  <div style="display:flex; flex-wrap:wrap; gap:24px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;">
    <a href="/bastion-about.html" style="color:var(--stone); text-decoration:none;">Built on Trust</a>
    <a href="/bastion-faq.html" style="color:var(--stone); text-decoration:none;">FAQ</a>
    <a href="/bastion-safety.html" style="color:var(--stone); text-decoration:none;">Safety Center</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="bastion-account-skirt.js"></script>
<script>
const SUPABASE_URL = 'https://xokyqobttfhugdponfpg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nb18Wk7poF2HR0ZjpiJFnQ_tvv4wl0o';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function formatMoney(n){
  const num = Number(n);
  if(isNaN(num)) return '—';
  return '$' + num.toLocaleString('en-US');
}
function shortId(id){
  return String(id).replace(/-/g, '').slice(0, 6).toUpperCase();
}
function setupReportButton(sellerId, sellerLabel){
  const toggleBtn = document.getElementById('reportToggleBtn');
  const form = document.getElementById('reportForm');
  const cancelBtn = document.getElementById('reportCancelBtn');
  const submitBtn = document.getElementById('reportSubmitBtn');

  toggleBtn.addEventListener('click', function(){
    toggleBtn.classList.add('hidden');
    form.classList.remove('hidden');
  });

  cancelBtn.addEventListener('click', function(){
    form.classList.add('hidden');
    toggleBtn.classList.remove('hidden');
  });

  submitBtn.addEventListener('click', async function(){
    const reason = document.getElementById('reportReason').value;
    if(!reason){
      alert('Please select a reason.');
      return;
    }
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const session = sessionData && sessionData.session;
    if(!session){
      window.location.href = 'bastion-auth.html';
      return;
    }
    const details = document.getElementById('reportDetails').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'SUBMITTING…';

    const { error } = await supabaseClient.from('reports').insert([{
      reporter_id: session.user.id,
      target_type: 'seller',
      target_id: sellerId,
      target_label: sellerLabel,
      reason: reason,
      details: details || null
    }]);

    if(error){
      alert('Could not submit report: ' + error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Report';
      return;
    }

    document.getElementById('reportReason').classList.add('hidden');
    document.getElementById('reportDetails').classList.add('hidden');
    submitBtn.classList.add('hidden');
    cancelBtn.classList.add('hidden');
    document.getElementById('reportDone').classList.remove('hidden');
  });
}

function renderStars(rating){
  const rounded = Math.round(rating);
  return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
}

async function loadSellerProfile(){
  const sellerId = new URLSearchParams(window.location.search).get('id');
  const loadingEl = document.getElementById('loadingState');
  const contentEl = document.getElementById('profileContent');

  if(!sellerId){
    loadingEl.innerHTML = '<h3>No seller specified</h3>';
    return;
  }

  try{
    const [listingsRes, tradesRes, reviewsRes, profileRes] = await Promise.all([
      supabaseClient.from('deals').select('*').eq('seller_id', sellerId).order('created_at', { ascending: false }),
      supabaseClient.from('transactions').select('*', { count: 'exact', head: true }).eq('seller_id', sellerId).eq('status', 'released'),
      supabaseClient.from('reviews').select('*').eq('seller_id', sellerId).order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('handle,id_verified,authenticity_verified').eq('id', sellerId).maybeSingle()
    ]);

    const listings = listingsRes.data || [];
    const tradeCount = tradesRes.count || 0;
    const reviews = reviewsRes.data || [];
    const avgRating = reviews.length > 0 ? reviews.reduce((s,r) => s + r.rating, 0) / reviews.length : null;
    const isTrusted = tradeCount >= 5;
    const profile = profileRes.data || {};
    const sellerLabel = profile.handle ? '@' + profile.handle : 'Seller ' + shortId(sellerId);

    document.getElementById('sellerName').textContent = sellerLabel;
    let metaHtml = isTrusted
      ? '<span class="trusted-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>Trusted Seller</span>'
      : 'Member of Bastion';
    if(profile.id_verified){
      metaHtml += '<span class="trusted-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 10h4M14 14h4"/></svg>ID Verified</span>';
    }
    if(profile.authenticity_verified){
      metaHtml += '<span class="trusted-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l7 4v6c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Authenticity Verified</span>';
    }
    document.getElementById('sellerMeta').innerHTML = metaHtml;
    setupReportButton(sellerId, sellerLabel);

    document.getElementById('statListings').textContent = listings.length;
    document.getElementById('statTrades').textContent = tradeCount;
    document.getElementById('statRating').textContent = avgRating != null ? avgRating.toFixed(1) : '—';

    const grid = document.getElementById('listingsGrid');
    if(listings.length === 0){
      grid.innerHTML = '<div class="empty-note">No active listings right now.</div>';
    } else {
      grid.innerHTML = listings.map(function(d){
        const name = escapeHtml(d.item_name || 'Untitled item');
        const photo = d.image_url ? '<img src="'+escapeHtml(d.image_url)+'" alt="'+name+'">' : '<span class="seal-tiny">B</span>';
        return `
          <div class="mini-card" onclick="window.location.href='bastion-deal-detail.html?id=${encodeURIComponent(d.id)}'">
            <div class="mini-photo">${photo}</div>
            <div>
              <div class="mini-name">${name}</div>
              <div class="mini-price">${formatMoney(d.price)}</div>
            </div>
          </div>`;
      }).join('');
    }

    const reviewsList = document.getElementById('reviewsList');
    if(reviews.length === 0){
      reviewsList.innerHTML = '<div class="empty-note">No reviews yet.</div>';
    } else {
      reviewsList.innerHTML = reviews.map(function(r){
        const date = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '';
        const comment = r.comment ? '<div class="review-comment">' + escapeHtml(r.comment) + '</div>' : '';
        return `
          <div class="review-item">
            <div class="review-stars">${renderStars(r.rating)}</div>
            ${comment}
            <div class="review-date">${date}</div>
          </div>`;
      }).join('');
    }

    loadingEl.classList.add('hidden');
    contentEl.classList.remove('hidden');

  } catch(err){
    loadingEl.innerHTML = '<h3>Could not load this profile</h3><p style="font-size:13px;margin-top:8px;">' + escapeHtml(err.message || String(err)) + '</p>';
  }
}

loadSellerProfile();

(async function checkUnreadMessages(){
  const dot = document.getElementById('navMsgDot');
  if(!dot) return;
  try{
    const { data: sessionData } = await supabaseClient.auth.getSession();
    const session = sessionData && sessionData.session;
    if(!session) return;
    const uid = session.user.id;
    const { data: convos } = await supabaseClient.from('conversations').select('id').or('buyer_id.eq.' + uid + ',seller_id.eq.' + uid);
    const convoIds = (convos || []).map(function(c){ return c.id; });
    if(!convoIds.length) return;
    const { data: unread } = await supabaseClient.from('messages').select('id').in('conversation_id', convoIds).is('read_at', null).neq('sender_id', uid).limit(1);
    if(unread && unread.length) dot.style.display = 'block';
  } catch(e){ /* silent */ }
})();

// Notifications: see bastion-notifications.js
</script>
